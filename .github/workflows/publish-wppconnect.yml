name: Publish @wppconnect/whaileys

# Publishes this fork to npm as @wppconnect/whaileys from the publish branch.
#
# WHY A `publish` BRANCH:
# The default branch (main) stays a faithful mirror of upstream (canove/whaileys)
# so rebasing/syncing is conflict-free. This `publish` branch is the ONLY place
# package.json carries the scoped name + the fork's repository url — which OIDC
# provenance REQUIRES to match the GitHub repo.
#
# Auth: GitHub Actions secret NPM_TOKEN.

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (publish branch)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build
        run: npm run build:all

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
          else
            npm publish --access public
          fi
